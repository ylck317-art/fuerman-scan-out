<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>通用电商测试版 · DEMO</title>
<style>
:root {
  --bg:#0b0f14; --bg2:#111820; --panel:#151c27; --panel2:#1a2330;
  --border:#243041; --border2:#2e3d52; --text:#e8eef7; --muted:#8b9bb4; --muted2:#6b7c94;
  --accent:#3b82f6; --accent2:#60a5fa; --green:#22c55e; --red:#ef4444; --orange:#f59e0b;
  --purple:#a78bfa; --cyan:#22d3ee; --radius:12px;
  --shadow:0 8px 28px rgba(0,0,0,.35);
  --font:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font)}
button,input,select{font-family:inherit} a{color:var(--accent2);text-decoration:none} a:hover{text-decoration:underline}
.app-header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0f1520,#0b0f14);border-bottom:1px solid var(--border);padding:14px 22px 0}
.header-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.titles{flex:1;min-width:200px}.titles h1{margin:0;font-size:18px;font-weight:700}
.titles .sub{color:var(--muted);font-size:12px;margin-top:2px}
.badge-demo{display:inline-flex;align-items:center;gap:6px;background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.35);padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.5px}
.header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock-box{text-align:right;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 12px;min-width:150px}
.clock-time{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.clock-date{font-size:11px;color:var(--muted)}
.mgr-select,.search-box{background:var(--panel);color:var(--text);border:1px solid var(--border2);border-radius:10px;padding:8px 12px;font-size:13px}
.search-box{width:170px}.search-box::placeholder{color:var(--muted2)}
.nav-tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto;padding-bottom:0}
.nav-tab{background:transparent;border:none;color:var(--muted);padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.nav-tab:hover{color:var(--text)}.nav-tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.layout{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px 22px 40px;max-width:1480px;margin:0 auto}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
.sidebar{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;height:fit-content;position:sticky;top:110px}
.sidebar h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.plat-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px;font-size:13px}
.plat-item:hover{background:var(--panel2)}.plat-item.active{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.35);color:var(--accent2)}
.plat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
.main{min-width:0}.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 12px;font-size:15px;font-weight:700}.panel .hint{color:var(--muted);font-size:12px;margin:-6px 0 12px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px}
.kpi .label{font-size:12px;color:var(--muted);margin-bottom:6px}.kpi .value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11px;color:var(--muted2);margin-top:4px}
.charts{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}@media(max-width:900px){.charts{grid-template-columns:1fr}}
.chart-box{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;min-height:220px}
.chart-box h3{margin:0 0 8px;font-size:13px;color:var(--muted)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.shop-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px}
.shop-card .name{font-weight:700;font-size:14px;margin-bottom:4px}
.shop-card .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.shop-card .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shop-card .m .l{font-size:11px;color:var(--muted2)}.shop-card .m .v{font-size:14px;font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--border2);background:rgba(255,255,255,.03)}
.tag.tm{color:#ff9f5a;border-color:rgba(255,106,0,.4)}.tag.smt{color:#93c5fd;border-color:rgba(59,130,246,.4)}
.tag.pdd{color:#f9a8d4;border-color:rgba(236,72,153,.4)}.tag.jd{color:#fca5a5;border-color:rgba(239,68,68,.4)}
.tag.al{color:#fcd34d;border-color:rgba(245,158,11,.4)}.tag.other{color:var(--cyan)}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.data th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--panel)}
table.data tr:hover td{background:rgba(255,255,255,.02)}
.prio{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.prio.紧急{background:rgba(239,68,68,.15);color:#fca5a5}.prio.重要{background:rgba(245,158,11,.15);color:#fcd34d}.prio.普通{background:rgba(59,130,246,.15);color:#93c5fd}
.status{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.05)}
.status.ok,.status.已完成,.status.通过,.status.活跃,.status.在售,.status.进行中{color:var(--green)}
.status.warn,.status.待处理,.status.处理中,.status.补货中,.status.待发货{color:var(--orange)}
.status.bad,.status.流失{color:var(--red)}
.todo-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--panel2)}
.todo-item.done{opacity:.55}.todo-item input{margin-top:3px}
.hidden{display:none!important}
.footer-note{text-align:center;color:var(--muted2);font-size:11px;padding:8px 22px 28px}
.empty{color:var(--muted);padding:24px;text-align:center}
.scroll{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:10px}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-top">
    <div class="logo-mark">通</div>
    <div class="titles">
      <h1>通用电商测试版 <span class="badge-demo">DEMO</span></h1>
      <div class="sub">演示数据 · 人名/店名已脱敏 · 基于真实销量结构 · Asia/Shanghai</div>
    </div>
    <div class="header-right">
      <select id="mgrSelect" class="mgr-select" title="切换经理"></select>
      <input id="q" class="search-box" placeholder="搜索店铺 / 商品 / 订单" />
      <div class="clock-box"><div class="clock-time" id="clockTime">--:--:--</div><div class="clock-date" id="clockDate">—</div></div>
    </div>
  </div>
  <nav class="nav-tabs" id="navTabs">
    <button class="nav-tab active" data-tab="overview">工作总览</button>
    <button class="nav-tab" data-tab="shops">店铺看板</button>
    <button class="nav-tab" data-tab="orders">订单</button>
    <button class="nav-tab" data-tab="aftersales">售后</button>
    <button class="nav-tab" data-tab="ads">推广/广告</button>
    <button class="nav-tab" data-tab="products">商品</button>
    <button class="nav-tab" data-tab="todos">待办</button>
    <button class="nav-tab" data-tab="customers">客户</button>
    <button class="nav-tab" data-tab="adapps">广告费申请</button>
    <button class="nav-tab" data-tab="settings">设置</button>
  </nav>
</header>

<div class="layout">
  <aside class="sidebar">
    <h3>平台筛选</h3>
    <div id="platList"></div>
    <h3 style="margin-top:18px">经理</h3>
    <div id="mgrSide"></div>
  </aside>
  <main class="main">
    <section id="tab-overview">
      <div class="panel"><h2>核心指标</h2><div class="kpi-grid" id="kpis"></div></div>
      <div class="panel"><h2>趋势与结构</h2><div class="hint">近 30 天销售额（按所选经理聚合）· 平台本月占比</div><div class="charts"><div class="chart-box"><h3>近 30 天销售</h3><div id="chartLine"></div></div><div class="chart-box"><h3>平台本月营业额</h3><div id="chartDonut"></div></div></div></div>
      <div class="panel"><h2>利润概览</h2><div class="scroll"><table class="data" id="profitTable"></table></div></div>
    </section>
    <section id="tab-shops" class="hidden"><div class="panel"><h2>店铺看板</h2><div class="hint" id="shopHint"></div><div class="shop-grid" id="shopGrid"></div></div></section>
    <section id="tab-orders" class="hidden"><div class="panel"><h2>订单中心</h2><div class="scroll"><table class="data" id="orderTable"></table></div></div></section>
    <section id="tab-aftersales" class="hidden"><div class="panel"><h2>售后工单</h2><div class="scroll"><table class="data" id="asTable"></table></div></div></section>
    <section id="tab-ads" class="hidden">
      <div class="panel"><h2>推广活动</h2><div class="scroll"><table class="data" id="promoTable"></table></div></div>
      <div class="panel"><h2>广告投放日报</h2><div class="scroll"><table class="data" id="adsDailyTable"></table></div></div>
    </section>
    <section id="tab-products" class="hidden"><div class="panel"><h2>商品中心</h2><div class="scroll"><table class="data" id="prodTable"></table></div></div></section>
    <section id="tab-todos" class="hidden"><div class="panel"><h2>待办事项</h2><div id="todoList"></div></div></section>
    <section id="tab-customers" class="hidden"><div class="panel"><h2>客户管理</h2><div class="scroll"><table class="data" id="custTable"></table></div></div></section>
    <section id="tab-adapps" class="hidden"><div class="panel"><h2>广告费申请</h2><div class="scroll"><table class="data" id="adappTable"></table></div></div></section>
    <section id="tab-settings" class="hidden">
      <div class="panel"><h2>工作台设置</h2><div id="settingsBox"></div></div>
      <div class="panel"><h2>网页版快捷入口</h2><div id="shortcutBox"></div></div>
      <div class="panel"><h2>操作说明</h2><div class="scroll"><table class="data" id="opsTable"></table></div></div>
      <div class="panel"><h2>知识素材库</h2><div class="scroll"><table class="data" id="knowTable"></table></div></div>
      <div class="panel"><h2>单据制作</h2><div class="scroll"><table class="data" id="docTable"></table></div></div>
    </section>
  </main>
</div>
<p class="footer-note">通用电商测试版 · 离线演示 · 数据已脱敏 · 仅供演示使用</p>

<script>
(function(){
  const D = window.DEMO;
  const state = { mgr: '全公司', plat: '全部', q: '', tab: 'overview' };
  const ¥ = n => {
    const x = Number(n)||0;
    if (Math.abs(x) >= 1e6) return '¥' + (x/1e6).toFixed(2) + 'M';
    if (Math.abs(x) >= 1e4) return '¥' + (x/1e4).toFixed(2) + '万';
    return '¥' + x.toLocaleString('zh-CN', {maximumFractionDigits:2});
  };
  const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const platClass = p => {
    if (!p) return 'other';
    if (p.includes('天猫')||p.includes('淘宝')) return 'tm';
    if (p.includes('速卖通')) return 'smt';
    if (p.includes('拼多多')) return 'pdd';
    if (p.includes('京东')) return 'jd';
    if (p.includes('阿里')) return 'al';
    return 'other';
  };
  function tickClock(){
    const now = new Date();
    const fmt = new Intl.DateTimeFormat('zh-CN', {timeZone:'Asia/Shanghai', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
    const dfmt = new Intl.DateTimeFormat('zh-CN', {timeZone:'Asia/Shanghai', year:'numeric', month:'2-digit', day:'2-digit', weekday:'short'});
    document.getElementById('clockTime').textContent = fmt.format(now);
    document.getElementById('clockDate').textContent = dfmt.format(now) + ' · Asia/Shanghai';
  }
  function shopFilter(s){
    if (state.mgr !== '全公司' && s.manager !== state.mgr) return false;
    if (state.plat !== '全部' && s.platform !== state.plat) return false;
    if (state.q){
      const q = state.q.toLowerCase();
      if (![s.name,s.platform,s.manager].join(' ').toLowerCase().includes(q)) return false;
    }
    return true;
  }
  function filteredShops(){ return D.shops.filter(shopFilter); }
  function salesForMgr(){
    if (state.mgr === '全公司') return D.sales;
    return D.sales.filter(s => s.manager === state.mgr);
  }
  function lastNDayTotals(n){
    // merge by date across selected managers
    const map = {};
    for (const block of salesForMgr()){
      const rows = block.rows.slice(-Math.max(n*3, n)); // buffer
      for (const r of rows){
        map[r.date] = (map[r.date]||0) + (r.total||0);
      }
    }
    const dates = Object.keys(map).sort();
    return dates.slice(-n).map(d => ({date:d, total:map[d]}));
  }
  function svgLine(points){
    if (!points.length) return '<div class="empty">暂无销售数据</div>';
    const w=560,h=200,pad=28;
    const max = Math.max(...points.map(p=>p.total),1);
    const step = (w-pad*2)/Math.max(points.length-1,1);
    const pts = points.map((p,i)=>{
      const x = pad + i*step;
      const y = h-pad - (p.total/max)*(h-pad*2);
      return [x,y,p];
    });
    const poly = pts.map(p=>p[0]+','+p[1]).join(' ');
    const circles = pts.filter((_,i)=> i%Math.ceil(points.length/8)===0 || i===points.length-1).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#60a5fa"/>`).join('');
    const labels = pts.filter((_,i)=> i===0 || i===points.length-1 || i===Math.floor(points.length/2)).map(p=>{
      const d=p[2].date.replace(/^\d{4}[\/\-]/,'');
      return `<text x="${p[0]}" y="${h-8}" text-anchor="middle" fill="#6b7c94" font-size="10">${esc(d)}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="200" preserveAspectRatio="none">
      <polyline fill="none" stroke="#3b82f6" stroke-width="2.5" points="${poly}"/>
      <polyline fill="url(#lg)" stroke="none" points="${pad},${h-pad} ${poly} ${pts[pts.length-1][0]},${h-pad}"/>
      <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(59,130,246,.25)"/><stop offset="100%" stop-color="rgba(59,130,246,0)"/></linearGradient></defs>
      ${circles}${labels}
      <text x="${pad}" y="16" fill="#8b9bb4" font-size="11">max ${esc(¥(max))}</text>
    </svg>`;
  }
  function svgDonut(items){
    const data = items.filter(i=>i.value>0);
    if (!data.length) return '<div class="empty">暂无平台数据</div>';
    const total = data.reduce((a,b)=>a+b.value,0)||1;
    const cx=110,cy=100,r=70,w=220,h=200;
    let a0=-Math.PI/2, paths='';
    data.forEach((it,idx)=>{
      const a1 = a0 + (it.value/total)*Math.PI*2;
      const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
      const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      const large = (a1-a0)>Math.PI?1:0;
      paths += `<path d="M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} Z" fill="${esc(it.color||'#3b82f6')}" opacity=".9"/>`;
      a0=a1;
    });
    const legend = data.map(it=>`<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin:3px 0"><span style="width:8px;height:8px;border-radius:50%;background:${esc(it.color)}"></span>${esc(it.name)} <span style="color:#8b9bb4">${esc(¥(it.value))}</span></div>`).join('');
    return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${paths}<circle cx="${cx}" cy="${cy}" r="42" fill="#151c27"/><text x="${cx}" y="${cy+4}" text-anchor="middle" fill="#e8eef7" font-size="12" font-weight="700">${esc(¥(total))}</text></svg><div>${legend}</div></div>`;
  }
  function renderKPIs(){
    const shops = filteredShops();
    const ytd = shops.reduce((a,s)=>a+s.ytd,0);
    const month = shops.reduce((a,s)=>a+s.month,0);
    const latest = shops.reduce((a,s)=>a+s.latest,0);
    const series = lastNDayTotals(30);
    const d30 = series.reduce((a,p)=>a+p.total,0);
    const adsSpend = D.ads_daily.reduce((a,r)=>a+(Number(r['广告花费'])||0),0);
    const pendingAS = D.aftersales.filter(r=>['待处理','处理中'].includes(r['工单状态'])).length;
    const openTodos = D.todos.filter(r=>String(r['完成'])!=='1' && String(r['完成']).toLowerCase()!=='true').length;
    const html = [
      {l:'2026 年度营业额',v:¥(ytd),s:shops.length+' 家店铺'},
      {l:'本月营业额',v:¥(month),s:state.mgr+' · '+state.plat},
      {l:'最新一天',v:¥(latest),s:'店铺合计'},
      {l:'近30天销售',v:¥(d30),s:series.length+' 个交易日'},
      {l:'广告花费(样本)',v:¥(adsSpend),s:D.ads_daily.length+' 条日报'},
      {l:'待办 / 售后',v:openTodos+' / '+pendingAS,s:'未完成 · 处理中'},
    ].map(k=>`<div class="kpi"><div class="label">${k.l}</div><div class="value">${k.v}</div><div class="sub">${esc(k.s)}</div></div>`).join('');
    document.getElementById('kpis').innerHTML = html;
    document.getElementById('chartLine').innerHTML = svgLine(series);
    const platItems = D.platforms.map(p=>{
      // if mgr filtered, sum from shops
      let val = p.month;
      if (state.mgr!=='全公司' || state.plat!=='全部'){
        val = D.shops.filter(s=>s.platform===p.name && (state.mgr==='全公司'||s.manager===state.mgr) && (state.plat==='全部'||s.platform===state.plat)).reduce((a,s)=>a+s.month,0);
      } else if (state.plat!=='全部' && p.name!==state.plat) val=0;
      return {name:p.name, value:val, color:p.color||'#3b82f6'};
    }).filter(x=>x.value>0 || state.plat==='全部');
    document.getElementById('chartDonut').innerHTML = svgDonut(platItems.filter(x=>x.value>0));
    // profit
    let ph = '<tr><th>月份</th><th>营业收入</th><th>货品成本</th><th>平台费用</th><th>广告投入</th><th>预估利润</th><th>利润率</th></tr>';
    for (const r of D.profit){
      ph += `<tr><td>${esc(r['月份'])}</td><td>${¥(r['营业收入'])}</td><td>${¥(r['货品成本'])}</td><td>${¥(r['平台费用'])}</td><td>${¥(r['广告投入'])}</td><td>${¥(r['预估利润'])}</td><td>${esc(r['利润率'])}%</td></tr>`;
    }
    document.getElementById('profitTable').innerHTML = ph;
  }
  function renderShops(){
    const shops = filteredShops().slice().sort((a,b)=>b.month-a.month);
    document.getElementById('shopHint').textContent = `共 ${shops.length} 家 · ${state.mgr} · ${state.plat}`;
    document.getElementById('shopGrid').innerHTML = shops.map(s=>`
      <div class="shop-card">
        <div class="name">${esc(s.name)}</div>
        <div class="meta"><span class="tag ${platClass(s.platform)}">${esc(s.platform)}</span> · ${esc(s.manager)}</div>
        <div class="metrics">
          <div class="m"><div class="l">年度</div><div class="v">${¥(s.ytd)}</div></div>
          <div class="m"><div class="l">本月</div><div class="v">${¥(s.month)}</div></div>
          <div class="m"><div class="l">最新一天</div><div class="v">${¥(s.latest)}</div></div>
          <div class="m"><div class="l">本月/年</div><div class="v">${s.ytd?((s.month/s.ytd)*100).toFixed(1):0}%</div></div>
        </div>
      </div>`).join('') || '<div class="empty">无匹配店铺</div>';
  }
  function matchQ(row, keys){
    if (!state.q) return true;
    const q = state.q.toLowerCase();
    return keys.some(k => String(row[k]||'').toLowerCase().includes(q));
  }
  function mgrShopNames(){
    if (state.mgr==='全公司') return null;
    return new Set(D.shops.filter(s=>s.manager===state.mgr).map(s=>s.name));
  }
  function renderOrders(){
    const names = mgrShopNames();
    let rows = D.orders.filter(r=>{
      if (names && !names.has(r['所属店铺'])) return false;
      if (state.plat!=='全部' && r['平台']!==state.plat) return false;
      return matchQ(r, ['订单号','所属店铺','商品名称','买家地区','订单状态']);
    });
    let h = '<tr><th>订单号</th><th>日期</th><th>店铺</th><th>平台</th><th>商品</th><th>数量</th><th>金额</th><th>地区</th><th>状态</th></tr>';
    for (const r of rows){
      h += `<tr><td>${esc(r['订单号'])}</td><td>${esc(r['下单日期'])}</td><td>${esc(r['所属店铺'])}</td><td><span class="tag ${platClass(r['平台'])}">${esc(r['平台'])}</span></td><td>${esc(r['商品名称'])}</td><td>${esc(r['数量'])}</td><td>${¥(r['订单金额'])}</td><td>${esc(r['买家地区'])}</td><td><span class="status ${esc(r['订单状态'])}">${esc(r['订单状态'])}</span></td></tr>`;
    }
    document.getElementById('orderTable').innerHTML = h + (rows.length?'': '<tr><td colspan="9" class="empty">无订单</td></tr>');
  }
  function renderAS(){
    const names = mgrShopNames();
    let rows = D.aftersales.filter(r=>{
      if (names && !names.has(r['所属店铺'])) return false;
      if (state.plat!=='全部' && r['平台']!==state.plat) return false;
      return matchQ(r, ['工单号','所属店铺','申请原因','工单状态']);
    });
    let h = '<tr><th>工单号</th><th>订单</th><th>日期</th><th>店铺</th><th>类型</th><th>原因</th><th>退款</th><th>状态</th></tr>';
    for (const r of rows){
      h += `<tr><td>${esc(r['工单号'])}</td><td>${esc(r['关联订单'])}</td><td>${esc(r['申请日期'])}</td><td>${esc(r['所属店铺'])}</td><td>${esc(r['售后类型'])}</td><td>${esc(r['申请原因'])}</td><td>${¥(r['退款金额'])}</td><td><span class="status ${esc(r['工单状态'])}">${esc(r['工单状态'])}</span></td></tr>`;
    }
    document.getElementById('asTable').innerHTML = h;
  }
  function renderAds(){
    let ph = '<tr><th>活动</th><th>平台</th><th>店铺</th><th>类型</th><th>预算</th><th>已花费</th><th>成交</th><th>ROI</th><th>状态</th></tr>';
    for (const r of D.promos){
      if (state.plat!=='全部' && r['平台']!==state.plat) continue;
      ph += `<tr><td>${esc(r['活动名称'])}</td><td>${esc(r['平台'])}</td><td>${esc(r['适用店铺'])}</td><td>${esc(r['活动类型'])}</td><td>${¥(r['活动预算'])}</td><td>${¥(r['已花费'])}</td><td>${¥(r['带来成交'])}</td><td>${esc(r['ROI'])}</td><td><span class="status ${esc(r['活动状态'])}">${esc(r['活动状态'])}</span></td></tr>`;
    }
    document.getElementById('promoTable').innerHTML = ph;
    let ah = '<tr><th>日期</th><th>平台</th><th>花费</th><th>点击</th><th>成交</th><th>ROI</th></tr>';
    for (const r of D.ads_daily){
      if (state.plat!=='全部' && r['平台']!==state.plat) continue;
      ah += `<tr><td>${esc(r['日期'])}</td><td>${esc(r['平台'])}</td><td>${¥(r['广告花费'])}</td><td>${esc(r['点击量'])}</td><td>${¥(r['成交金额'])}</td><td>${esc(r['ROI'])}</td></tr>`;
    }
    document.getElementById('adsDailyTable').innerHTML = ah;
  }
  function renderProducts(){
    const names = mgrShopNames();
    let rows = D.products.filter(r=>{
      if (names && !names.has(r['所属店铺'])) return false;
      if (state.plat!=='全部' && r['平台']!==state.plat) return false;
      return matchQ(r, ['商品编号','商品名称','所属店铺']);
    });
    let h = '<tr><th>编号</th><th>名称</th><th>店铺</th><th>平台</th><th>售价</th><th>库存</th><th>近30天</th><th>评分</th><th>状态</th></tr>';
    for (const r of rows){
      h += `<tr><td>${esc(r['商品编号'])}</td><td>${esc(r['商品名称'])}</td><td>${esc(r['所属店铺'])}</td><td>${esc(r['平台'])}</td><td>${¥(r['售价'])}</td><td>${esc(r['库存'])}</td><td>${esc(r['近30天销量'])}</td><td>${esc(r['评分'])}</td><td><span class="status ${esc(r['状态'])}">${esc(r['状态'])}</span></td></tr>`;
    }
    document.getElementById('prodTable').innerHTML = h;
  }
  function renderTodos(){
    const box = document.getElementById('todoList');
    box.innerHTML = D.todos.map((t,i)=>{
      const done = String(t['完成'])==='1' || String(t['完成']).toLowerCase()==='true';
      return `<div class="todo-item ${done?'done':''}">
        <input type="checkbox" ${done?'checked':''} data-i="${i}" class="todo-check"/>
        <div style="flex:1">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <strong>${esc(t['事项标题'])}</strong>
            <span class="prio ${esc(t['紧急程度'])}">${esc(t['紧急程度'])}</span>
            <span class="tag ${platClass(t['涉及平台'])}">${esc(t['涉及平台'])}</span>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(t['事项说明'])}</div>
          <div style="font-size:11px;color:var(--muted2);margin-top:4px">截止 ${esc(t['截止时间'])}</div>
        </div>
      </div>`;
    }).join('') || '<div class="empty">无待办</div>';
    box.querySelectorAll('.todo-check').forEach(el=>{
      el.addEventListener('change', ()=>{
        const i = +el.dataset.i;
        D.todos[i]['完成'] = el.checked ? '1' : '0';
        renderTodos(); renderKPIs();
      });
    });
  }
  function renderCustomers(){
    let h = '<tr><th>编号</th><th>客户</th><th>类型</th><th>联系人</th><th>地区</th><th>平台</th><th>订单</th><th>金额</th><th>等级</th><th>状态</th></tr>';
    for (const r of D.customers){
      if (state.plat!=='全部' && r['来源平台']!==state.plat) continue;
      if (!matchQ(r, ['客户名称','联系人','客户编号'])) continue;
      h += `<tr><td>${esc(r['客户编号'])}</td><td>${esc(r['客户名称'])}</td><td>${esc(r['客户类型'])}</td><td>${esc(r['联系人'])}</td><td>${esc(r['国家/地区'])}</td><td>${esc(r['来源平台'])}</td><td>${esc(r['累计订单'])}</td><td>${¥(r['累计金额'])}</td><td>${esc(r['客户等级'])}</td><td><span class="status ${esc(r['客户状态'])}">${esc(r['客户状态'])}</span></td></tr>`;
    }
    document.getElementById('custTable').innerHTML = h;
  }
  function renderAdApps(){
    let rows = D.ad_applications.filter(r=>{
      if (state.mgr!=='全公司' && (r['负责人']||r._manager_file)!==state.mgr) return false;
      return true;
    });
    let h = '<tr><th>申请日期</th><th>负责人</th><th>平台</th><th>店铺</th><th>上月营业额</th><th>充值</th><th>标准/时长</th><th>审核</th><th>审核人</th></tr>';
    for (const r of rows){
      const std = r['申请标准'] || r['金额使用时间'] || r['使用日期'] || '';
      h += `<tr><td>${esc(r['申请日期'])}</td><td>${esc(r['负责人']||r._manager_file)}</td><td>${esc(r['店铺平台'])}</td><td>${esc(r['店铺名称'])}</td><td>${¥(r['上月营业额']||r['上个月营业额'])}</td><td>${¥(r['充值金额'])}</td><td>${esc(std)}</td><td><span class="status ${esc(r['审核']||'')}">${esc(r['审核']||'—')}</span></td><td>${esc(r['审核人']||'—')}</td></tr>`;
    }
    document.getElementById('adappTable').innerHTML = h + (rows.length?'':'<tr><td colspan="9" class="empty">无申请记录</td></tr>');
  }
  function renderSettings(){
    const s = (D.settings&&D.settings[0])||{};
    document.getElementById('settingsBox').innerHTML = `<div class="kpi-grid">
      <div class="kpi"><div class="label">负责人</div><div class="value" style="font-size:18px">${esc(s['负责人']||'张三')}</div></div>
      <div class="kpi"><div class="label">联系电话</div><div class="value" style="font-size:18px">${esc(s['联系电话']||'')}</div></div>
      <div class="kpi"><div class="label">备注</div><div class="sub" style="font-size:13px;color:var(--text)">${esc(s['备注']||'')}</div></div>
    </div>`;
    document.getElementById('shortcutBox').innerHTML = (D.shortcuts||[]).map(r=>`
      <div style="padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--panel2)">
        <div style="font-weight:700">${esc(r['名称'])}</div>
        <div style="font-size:12px;color:var(--muted);margin:4px 0">${esc(r['说明'])}</div>
        ${r['网址']?`<a href="${esc(r['网址'])}" target="_blank" rel="noopener">${esc(r['网址'])}</a>`:'<span class="muted">无链接</span>'}
      </div>`).join('');
    let oh='<tr><th>序号</th><th>章节</th><th>摘要</th></tr>';
    for (const r of D.ops||[]) oh += `<tr><td>${esc(r['序号'])}</td><td>${esc(r['章节'])}</td><td>${esc(r['内容摘要'])}</td></tr>`;
    document.getElementById('opsTable').innerHTML = oh;
    let kh='<tr><th>素材</th><th>类型</th><th>数量</th><th>归属</th><th>日期</th><th>状态</th></tr>';
    for (const r of D.knowledge||[]) kh += `<tr><td>${esc(r['素材名称'])}</td><td>${esc(r['素材类型'])}</td><td>${esc(r['素材数量'])}</td><td>${esc(r['归属'])}</td><td>${esc(r['更新日期'])}</td><td>${esc(r['状态'])}</td></tr>`;
    document.getElementById('knowTable').innerHTML = kh;
    let dh='<tr><th>编号</th><th>类型</th><th>标题</th><th>客户</th><th>金额</th><th>制单人</th><th>日期</th><th>状态</th></tr>';
    for (const r of D.docs||[]) dh += `<tr><td>${esc(r['单据编号'])}</td><td>${esc(r['单据类型'])}</td><td>${esc(r['单据标题'])}</td><td>${esc(r['关联客户'])}</td><td>${¥(r['单据金额'])}</td><td>${esc(r['制单人'])}</td><td>${esc(r['制单日期'])}</td><td>${esc(r['单据状态'])}</td></tr>`;
    document.getElementById('docTable').innerHTML = dh;
  }
  function renderSide(){
    const plats = ['全部', ...D.platforms.map(p=>p.name)];
    document.getElementById('platList').innerHTML = plats.map(p=>{
      const color = (D.platforms.find(x=>x.name===p)||{}).color || '#64748b';
      return `<div class="plat-item ${state.plat===p?'active':''}" data-p="${esc(p)}"><span><span class="plat-dot" style="background:${esc(color)}"></span>${esc(p)}</span></div>`;
    }).join('');
    document.querySelectorAll('.plat-item').forEach(el=>el.addEventListener('click',()=>{state.plat=el.dataset.p; renderAll();}));
    const mgrs = ['全公司', ...D.managers.map(m=>m.name)];
    document.getElementById('mgrSide').innerHTML = mgrs.map(m=>`<div class="plat-item ${state.mgr===m?'active':''}" data-m="${esc(m)}">${esc(m)}</div>`).join('');
    document.querySelectorAll('#mgrSide .plat-item').forEach(el=>el.addEventListener('click',()=>{state.mgr=el.dataset.m; document.getElementById('mgrSelect').value=state.mgr; renderAll();}));
  }
  function renderManagerSelect(){
    const sel = document.getElementById('mgrSelect');
    const mgrs = ['全公司', ...D.managers.map(m=>m.name)];
    sel.innerHTML = mgrs.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
    sel.value = state.mgr;
  }
  function showTab(tab){
    state.tab = tab;
    document.querySelectorAll('.nav-tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
    ['overview','shops','orders','aftersales','ads','products','todos','customers','adapps','settings'].forEach(t=>{
      document.getElementById('tab-'+t).classList.toggle('hidden', t!==tab);
    });
  }
  function renderAll(){
    renderSide();
    renderKPIs();
    renderShops();
    renderOrders();
    renderAS();
    renderAds();
    renderProducts();
    renderTodos();
    renderCustomers();
    renderAdApps();
    renderSettings();
  }
  document.getElementById('mgrSelect').addEventListener('change', e=>{state.mgr=e.target.value; renderAll();});
  document.getElementById('q').addEventListener('input', e=>{state.q=e.target.value.trim(); renderAll();});
  document.querySelectorAll('.nav-tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
  tickClock(); setInterval(tickClock,1000);
  renderManagerSelect();
  renderAll();
  showTab('overview');
})();
</script>
</body>
</html>
